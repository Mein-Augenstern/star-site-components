<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>分布式锁看门狗 · 琥珀影院版（集群分布式）</title>
<style>
  * { margin:0; padding:0; }
  html,body { background:#050608; height:100%; display:flex; align-items:center;
    justify-content:center; overflow:hidden; }
  /* 自适应任意面板大小：画布等比缩放居中，永不出框 */
  canvas { display:block; max-width:100vw; max-height:100vh; width:auto; height:auto; }
  #start { position:fixed; inset:0; z-index:9; background:#050608; display:flex;
    flex-direction:column; align-items:center; justify-content:center; gap:40px;
    font-family:-apple-system,"PingFang SC",sans-serif; }
  #start button { width:220px; height:220px; border-radius:50%; border:6px solid #d9a94e;
    background:rgba(217,169,78,.08); font-size:96px; color:#d9a94e; cursor:pointer; }
  #start p { font-size:36px; color:#8b8676; }
  #stat { position:fixed; top:12px; right:16px; z-index:9; color:#d9a94e;
    font-size:24px; font-family:Menlo,monospace; }
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<audio id="bgm" src="mix.m4a" preload="auto"></audio>
<div id="start"><button id="go">▶</button><p>动画预览（出片工具）<br>带声音的成片请打开 preview.html</p></div>
<div id="stat"></div>
<script>
(function () {
  "use strict";
  var W = 1080, H = 1920;
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var TOTAL = 62.5, TAIL = 1.0;
  var INK = "#d9a94e", INK_HI = "#ffd27d", PAPER = "#f2e8d5", DIM = "rgba(217,169,78,.38)";
  var RED = "#ff4d4d", BG = "#050608", CARD = "#0a0b0f", SUB = "#8b8676", WARM = "#cfc4ad";
  var SERIF = '"Songti SC","STSong",serif';
  var SANS = '-apple-system,"PingFang SC",sans-serif';
  var MONO = '"SF Mono",Menlo,monospace';

  var CAPTIONS = [
    [0,    "你的分布式锁，会在长任务中途被人抢走"],
    [3.5,  "集群四台实例抢同一把锁：只允许一台赢"],
    [9.2,  "TTL 一到锁被收回 —— 两个 Pod 同时在跑！"],
    [12,   "看门狗：每 TTL/3 帮你续期，锁永不过期"],
    [20.5, "嵌套加锁：A 对同一把锁，拿了两层"],
    [25,   "内层 unlock 之后，看门狗被顺手关掉"],
    [31.8, "TTL 过期：另一台抢到锁，两个同时在跑！"],
    [36,   "修复只要一步：重入深度计数"],
    [41,   "内层只递减，归零才真正停狗"],
    [48,   "上线前三个动作，一个都不能少"],
    [58,   "收藏这篇 📌 你的锁，谁在续期？"]
  ];
  var HUDS = [
    ["00 钩子 · THE HOOK",        "FIG. 00 — A TICKING LOCK"],
    ["01 痛点 · THE LEAK",        "FIG. 01 — FOUR PODS, ONE LOCK"],
    ["02 解法 · THE WATCHDOG",    "FIG. 02 — RENEW EVERY TTL/3"],
    ["03 踩坑 · THE P0",          "FIG. 03 — A NESTED UNLOCK"],
    ["04 修复 · THE FIX",         "FIG. 04 — DEPTH COUNTER"],
    ["05 清单 · THE CHECKLIST",   "FIG. 05 — THREE GUARDS"],
    ["06 尾声 · YOUR TURN",       "FIG. 06 — STAR-SITE COMPONENTS"]
  ];
  var SCENE_BOUNDS = [[0,3.5],[3.5,12],[12,22],[22,36],[36,48],[48,58],[58,TOTAL+1]];

  /* ---------- 确定性随机 ---------- */
  function prand(i) {
    var t = (i + 0x6D2B79F5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  var STARS = [];
  for (var i0 = 0; i0 < 110; i0++) {
    STARS.push({ x: prand(i0) * W, y: prand(i0 + 500) * H, r: 0.6 + prand(i0 + 900) * 1.6,
                 tw: prand(i0 + 1300) * 6.28, sp: 4 + prand(i0 + 1700) * 10 });
  }
  var SPARKS = [];
  for (var k0 = 0; k0 < 46; k0++) {
    SPARKS.push({ a: prand(k0 + 2100) * 6.283, v: 120 + prand(k0 + 2600) * 420,
                  r: 1.2 + prand(k0 + 3100) * 2.4, ts: prand(k0 + 3500) * 0.18 });
  }

  /* ---------- 工具 ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function popT(lt, at, dur) { return clamp((lt - (at || 0)) / (dur || 0.5), 0, 1); }
  function easeOutBack(p) { var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
  function rr(x, y, w, h, r) { ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur || 22; }
  function noGlow() { ctx.shadowBlur = 0; ctx.shadowColor = "transparent"; }
  function txt(str, x, y, size, weight, color, align, mono, serif, spacing) {
    ctx.fillStyle = color; ctx.textAlign = (typeof align === "string") ? align : "center"; ctx.textBaseline = "alphabetic";
    ctx.font = (weight || 700) + " " + size + "px " + (mono ? MONO : (serif ? SERIF : SANS));
    if (spacing) {
      var total = 0;
      for (var i = 0; i < str.length; i++) total += ctx.measureText(str[i]).width + spacing;
      var px = (align === "left" ? x : (align === "right" ? x - total + spacing : x - total / 2));
      for (var j = 0; j < str.length; j++) {
        ctx.fillText(str[j], px, y); px += ctx.measureText(str[j]).width + spacing;
      }
      return total;
    }
    ctx.fillText(str, x, y);
    return ctx.measureText(str).width;
  }
  function popStr(lt, at) { return easeOutBack(popT(lt, at)); }
  function popText(str, x, y, size, weight, color, lt, at, serif, align) {
    var p = popStr(lt, at);
    if (p <= 0) return;
    ctx.save();
    ctx.translate(x, y); ctx.scale(p, p);
    ctx.globalAlpha = clamp(p * 1.6, 0, 1);
    txt(str, 0, 0, size, weight, color, align || "center", false, serif);
    ctx.restore();
  }
  function underline(x, y, w, lt, at, color) {
    var p = easeOutCubic(popT(lt, at, 0.6));
    if (p <= 0) return;
    ctx.save();
    glow(color, 14); ctx.fillStyle = color;
    ctx.fillRect(x - w / 2, y, w * p, 5);
    ctx.restore();
  }
  function dashedRect(x, y, w, h, r, color, glowOn) {
    ctx.save();
    if (glowOn) glow(color, 16);
    rr(x, y, w, h, r);
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.setLineDash([14, 11]); ctx.stroke();
    ctx.restore();
  }
  function sparkBurst(cx, cy, lt, at) {
    if (lt < at) return;
    var e = lt - at;
    if (e > 1.4) return;
    for (var i = 0; i < SPARKS.length; i++) {
      var s = SPARKS[i];
      var p = clamp((e - s.ts) / 1.2, 0, 1);
      if (p <= 0 || p >= 1) continue;
      var d = s.v * easeOutCubic(p);
      ctx.save();
      ctx.globalAlpha = (1 - p) * 0.9;
      glow(INK_HI, 10); ctx.fillStyle = INK_HI;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(s.a) * d, cy + Math.sin(s.a) * d * 0.9 - p * 40, s.r, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ---------- 背景与骨架 ---------- */
  function drawBg(s, shakeX, shakeY) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(shakeX, shakeY);
    for (var i = 0; i < STARS.length; i++) {
      var st = STARS[i];
      var tw = 0.25 + 0.55 * Math.abs(Math.sin(st.tw + s * st.sp * 0.3));
      ctx.globalAlpha = tw * 0.5;
      ctx.fillStyle = INK;
      var dx = (st.x + s * 2.2) % (W + 40) - 20;
      ctx.beginPath(); ctx.arc(dx, st.y, st.r, 0, 6.283); ctx.fill();
    }
    ctx.restore();
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.75);
    vg.addColorStop(0, "rgba(5,6,8,0)");
    vg.addColorStop(1, "rgba(2,3,4,.8)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  function hudChrome(s, sceneIdx) {
    var hud = HUDS[sceneIdx];
    ctx.save();
    ctx.globalAlpha = 0.85;
    txt(hud[0], 64, 96, 24, 700, DIM, "left", false, false, 2);
    txt("分布式锁 · WATCHDOG", W - 64, 96, 24, 700, DIM, "right", false, false, 2);
    txt(hud[1], 64, H - 44, 22, 700, DIM, "left", true, false, 1);
    var mm = Math.floor(s / 60), ss = Math.floor(s % 60);
    txt(("0" + mm).slice(-2) + ":" + ("0" + ss).slice(-2) + " / 01:02", W - 64, H - 44,
        22, 700, DIM, "right", true, false, 1);
    ctx.restore();
  }
  function splitCaption(msg) {             // 超宽字幕断行：断点不落在标点/空格
    ctx.font = "600 44px " + SERIF;
    if (ctx.measureText(msg).width <= 860) return [msg];
    var mid = Math.ceil(msg.length / 2);
    var PUNCT = "，。：——！？、·…；";
    while (mid > 4 && (PUNCT.indexOf(msg.charAt(mid)) !== -1 || msg.charAt(mid) === " ")) mid--;
    return [msg.slice(0, mid), msg.slice(mid)];
  }
  function captionBar(s) {
    var fi = 0;
    for (var j = 0; j < CAPTIONS.length; j++) if (s >= CAPTIONS[j][0]) fi = j;
    var capIn = easeOutCubic(clamp((s - CAPTIONS[fi][0]) / 0.3, 0, 1));
    ctx.save();
    ctx.globalAlpha = capIn;
    rr(70, 1655, 940, 150, 10);
    ctx.fillStyle = "rgba(8,9,12,.88)"; ctx.fill();
    ctx.strokeStyle = "rgba(217,169,78,.25)"; ctx.lineWidth = 2; ctx.stroke();
    var segs = splitCaption(CAPTIONS[fi][1]);
    for (var k = 0; k < segs.length; k++) {
      txt(segs[k], 540, 1722 + k * 56 - (segs.length - 1) * 28, 44, 600, PAPER, "center", false, true);
    }
    ctx.restore();
  }
  function progressBar(s) {
    ctx.fillStyle = "rgba(217,169,78,.15)"; ctx.fillRect(0, 0, W, 8);
    ctx.save(); glow(INK, 12); ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W * clamp(s / TOTAL, 0, 1), 8); ctx.restore();
  }

  /* ---------- 集群几何（S2/S3/S4 共用） ---------- */
  var CX = [190, 425, 660, 895];           // 四实例中心 x
  var PY = 640, PW = 200, PH = 220;        // 集群实例卡
  var HUB = { x: 380, y: 380, w: 320, h: 150 };

  function cardRect(x, y, w, h, lt, at, stroke, glowOn) {
    var p = popStr(lt, at);
    if (p <= 0) return false;
    ctx.save();
    var cx = x + w / 2, cy = y + h / 2;
    ctx.translate(cx, cy); ctx.scale(p, p); ctx.translate(-cx, -cy);
    ctx.globalAlpha = clamp(p * 1.6, 0, 1);
    rr(x, y, w, h, 14);
    ctx.fillStyle = CARD; ctx.fill();
    if (glowOn) glow(stroke, 22);
    ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke();
    noGlow();
    ctx.restore();                          // 必须配对：泄漏 save 栈 ~88 层后渲染冻结
    return true;
  }
  function bar(x, y, w, h, frac, color, glowOn) {
    rr(x, y, w, h, 6); ctx.fillStyle = "#141310"; ctx.fill();
    if (frac > 0.005) {
      ctx.save();
      if (glowOn) glow(color, 12);
      rr(x, y, w * clamp(frac, 0, 1), h, 6); ctx.fillStyle = color; ctx.fill();
      ctx.restore();
    }
  }
  function hubCard(lt, at, state, stateColor, glowOn) {
    if (!cardRect(HUB.x, HUB.y, HUB.w, HUB.h, lt, at, glowOn ? INK : "rgba(217,169,78,.5)", glowOn)) return;
    txt("锁存储", HUB.x + HUB.w / 2, HUB.y + 44, 30, 800, WARM);
    txt("DB / Redis", HUB.x + HUB.w / 2, HUB.y + 74, 22, 700, SUB, "center", true);
    glow(glowOn ? "rgba(255,210,125,.8)" : "rgba(217,169,78,.4)", 18);
    txt("🔒", HUB.x + 60, HUB.y + 126, 42, 400, PAPER);
    noGlow();
    txt(state, HUB.x + 118, HUB.y + 126, 27, 800, stateColor || WARM, "left");
  }
  function conns(alpha, winnerIdx) {
    ctx.save();
    ctx.globalAlpha = alpha;
    for (var i = 0; i < 4; i++) {
      ctx.strokeStyle = i === winnerIdx ? INK : "rgba(217,169,78,.22)";
      ctx.lineWidth = i === winnerIdx ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(540, HUB.y + HUB.h);
      ctx.lineTo(CX[i], PY);
      ctx.stroke();
    }
    ctx.restore();
  }
  function racePulses(lt, t0) {
    if (lt < t0 || lt >= t0 + 0.85) return;
    for (var i = 0; i < 4; i++) {
      var ph = ((lt - t0) * 1.6 + i * 0.22) % 1;
      if (ph > 0.75) continue;
      var x = CX[i] + (540 - CX[i]) * ph;
      var y = PY + (HUB.y + HUB.h - PY) * ph;
      ctx.save();
      ctx.globalAlpha = 0.85 * (1 - ph * 0.3);
      glow(INK_HI, 8); ctx.fillStyle = INK_HI;
      ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }
  function renewPulse(lt, cyc, fromX) {
    if (cyc < 0 || cyc > 0.5) return;
    var ph = cyc / 0.5;
    var x = fromX + (540 - fromX) * ph;
    var y = PY - 20 + (HUB.y + HUB.h - (PY - 20)) * ph;
    ctx.save();
    ctx.globalAlpha = 0.9;
    glow(INK_HI, 10); ctx.fillStyle = INK_HI;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  function clusterPod(i, lt, at, opts) {    // 集群实例卡（220 高）
    var x = CX[i] - PW / 2;
    if (!cardRect(x, PY, PW, PH, lt, at, opts.stroke, opts.glow)) return;
    txt("🖥️", CX[i], PY + 62, 46, 400, PAPER);
    txt(opts.name, CX[i], PY + 112, 32, 800, WARM);
    var lines = opts.stateLines || [opts.state || ""];
    for (var k = 0; k < lines.length; k++) {
      txt(lines[k], CX[i], PY + 156 + k * 34, 24, 700, opts.stateColor || SUB);
    }
    if (opts.ttlFrac != null) bar(x + 22, PY + PH - 30, PW - 44, 14, opts.ttlFrac,
                                 opts.ttlColor || INK, opts.ttlGlow);
  }
  function flyLock(lt, at, dur, x0, y0, x1, y1) {
    var p = (lt - at) / dur;
    if (p < 0 || p > 1) return;
    var e = easeOutCubic(p);
    ctx.save();
    glow("rgba(255,210,125,.9)", 26);
    txt("🔒", x0 + (x1 - x0) * e, y0 + (y1 - y0) * e + 16, 46, 400, PAPER);
    ctx.restore();
  }
  function stripCard(x, w, y, h, lt, at, opts) {   // （已弃用：S4 改集群视图）保留占位以免外部引用断裂
    return cardRect(x, y, w, h, lt, at, opts.stroke, opts.glow);
  }

  /* ---------- S1 钩子 0–3.5 ---------- */
  function s1(lt) {
    var p0 = popStr(lt, 0.05);
    if (p0 > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(p0 * 1.6, 0, 1);
      var bw = 560, bh = 84, bx = (W - bw) / 2, by = 505;
      ctx.translate(bx + bw / 2, by + bh / 2); ctx.scale(p0, p0); ctx.translate(-(bx + bw / 2), -(by + bh / 2));
      rr(bx, by, bw, bh, 8);
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      txt("真实 P0 踩坑复盘", W / 2, by + 58, 42, 800, INK_HI, "center", false, false, 6);
      ctx.restore();
    }
    var lines = [["你的分布式锁", PAPER], ["会在长任务中途", RED], ["被人抢走", PAPER]];
    for (var i = 0; i < lines.length; i++) {
      popText(lines[i][0], W / 2, 690 + i * 138, 94, 900, lines[i][1], lt, 0.2 + i * 0.14, true);
    }
    underline(W / 2, 715, 420, lt, 0.7, INK);
    var cp = popStr(lt, 0.6);                // 开场即给集群拓扑：4 台实例 + 锁存储
    if (cp > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(cp * 1.6, 0, 1) * 0.92;
      rr(390, 1120, 300, 92, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = "rgba(217,169,78,.6)"; ctx.lineWidth = 2; ctx.stroke();
      txt("🔒 锁存储 · DB / Redis", 540, 1176, 24, 800, WARM);
      ctx.strokeStyle = "rgba(217,169,78,.22)"; ctx.lineWidth = 1.5;
      for (var c1 = 0; c1 < 4; c1++) {
        ctx.beginPath(); ctx.moveTo(540, 1212); ctx.lineTo(CX[c1], 1272); ctx.stroke();
      }
      for (var p1 = 0; p1 < 4; p1++) {
        var px0 = CX[p1] - 88;
        rr(px0, 1272, 176, 112, 10); ctx.fillStyle = CARD; ctx.fill();
        ctx.strokeStyle = "rgba(217,169,78,.45)"; ctx.lineWidth = 2; ctx.stroke();
        txt("🖥️", CX[p1], 1324, 30, 400, PAPER);
        txt("Pod " + "ABCD"[p1], CX[p1], 1366, 24, 800, WARM);
      }
      txt("4 台实例，都在执行同一个 tryLock() —— 故事从这里开始", 540, 1444, 26, 600, SUB);
      ctx.restore();
    }
  }

  /* ---------- S2 痛点 3.5–12：四实例竞抢，TTL 过期跨实例被抢 ---------- */
  function s2(lt) {
    popText("没有看门狗的世界", W / 2, 300, 62, 900, PAPER, lt, 0.1, true);
    underline(W / 2, 325, 430, lt, 0.35, INK);

    var expired = lt >= 5.2;                 // TTL 到期
    var stolen = lt >= 5.55;                 // C 抢到
    hubCard(lt, 0.2,
      lt < 1.1 ? "空闲" : (expired ? (stolen ? "Pod C" : "过期") : "Pod A"),
      expired ? RED : (lt >= 1.1 ? WARM : SUB),
      !expired);
    conns(0.5, lt >= 1.1 && !expired ? 0 : (stolen ? 2 : -1));
    racePulses(lt, 0.4);
    flyLock(lt, 1.1, 0.45, 540, 435, CX[0], PY + 110);        // 存储授予 A
    flyLock(lt, 5.2, 0.35, CX[0], PY + 110, 540, 435);        // 过期收回
    flyLock(lt, 5.55, 0.45, 540, 435, CX[2], PY + 110);       // 授予 C

    clusterPod(0, lt, 0.5, {
      name: "Pod A", stroke: expired ? "rgba(217,169,78,.25)" : INK, glow: !expired,
      stateLines: expired ? ["还在跑 🔥"] : (lt >= 1.1 ? ["持锁 🔒", "任务中"] : ["tryLock…"]),
      stateColor: expired ? RED : (lt >= 1.1 ? WARM : SUB),
      ttlFrac: lt >= 1.1 ? 1 - clamp((lt - 1.7) / 3.5, 0, 1) : null,
      ttlColor: expired ? RED : INK, ttlGlow: !expired,
      taskFrac: clamp((lt - 1.7) / 9.0, 0, 0.55)
    });
    for (var i = 1; i < 4; i++) {
      (function (i) {
        var isThief = stolen && i === 2;
        clusterPod(i, lt, 0.5 + i * 0.08, {
          name: "Pod " + "ABCD"[i],
          stroke: isThief ? RED : "rgba(217,169,78,.2)", glow: isThief,
          stateLines: isThief ? ["抢到锁 🔒", "开跑"] : (lt >= 1.1 ? ["未获锁", "跳过"] : ["tryLock…"]),
          stateColor: isThief ? RED : SUB
        });
      })(i);
    }
    // 代码层原理：竞争的真相就是所有实例都在跑同一段 tryLock
    var pc = popStr(lt, 1.3);
    if (pc > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(pc * 1.6, 0, 1) * 0.96;
      var cardH = expired ? 192 : 142;
      rr(90, 940, 900, cardH, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = expired ? "rgba(255,77,77,.55)" : "rgba(217,169,78,.4)";
      ctx.lineWidth = 2; ctx.stroke();
      txt('if (tryLock("settle", TTL)) {', 120, 988, 28, 800, "#e8d9b8", "left", true);
      txt('// 四台实例同时在跑这一行', 960, 988, 24, 600, SUB, "right");
      txt('doLongTask();', 160, 1032, 28, 800, "#e8d9b8", "left", true);
      txt('// 只有赢的那台真正执行', 960, 1032, 24, 600, SUB, "right");
      if (expired) {
        txt('} // TTL 到期无人续期 → 锁自动释放', 120, 1092, 28, 800, RED, "left", true);
      }
      ctx.restore();
    }
    if (stolen) {
      popText("⚠ A 和 C 同时在跑", W / 2, 1180, 62, 900, RED, lt, 6.5, true);
      popText("集群互斥失效！", W / 2, 1268, 62, 900, RED, lt, 6.65, true);
    }
  }

  /* ---------- S3 解法 12–22：看门狗续期，全集群恰一 ---------- */
  function s3(lt) {
    popText("解法：看门狗 🐕", W / 2, 300, 62, 900, INK_HI, lt, 0.1, true);
    underline(W / 2, 325, 430, lt, 0.35, INK);

    var cyc = (lt - 0.6) % 1.9;
    hubCard(lt, 0.2, "续期中", WARM, true);
    conns(0.5, 0);
    renewPulse(lt, cyc, CX[0]);
    if (cyc >= 0.45 && cyc < 1.1) {
      ctx.save();
      ctx.globalAlpha = 1 - (cyc - 0.45) / 0.65;
      glow(INK_HI, 12);
      txt("+TTL", 600, HUB.y + HUB.h + 34, 32, 900, INK_HI, "left", true);
      ctx.restore();
    }

    var done = lt >= 8.0;
    clusterPod(0, lt, 0.25, {
      name: "Pod A 🐕", stroke: INK, glow: true,
      stateLines: done ? ["✓ 任务完成"] : ["持锁 🔒", "任务中"],
      stateColor: done ? INK_HI : WARM,
      ttlFrac: done ? 1 : 1 - (cyc / 1.9) * 0.92, ttlColor: INK, ttlGlow: true,
      taskFrac: clamp((lt - 0.4) / 7.6, 0, 1)
    });
    for (var i = 1; i < 4; i++) {
      (function (i) {
        clusterPod(i, lt, 0.3 + i * 0.08, {
          name: "Pod " + "ABCD"[i], stroke: "rgba(217,169,78,.2)",
          stateLines: ["未获锁", "跳过"], stateColor: SUB
        });
      })(i);
    }
    // 代码层原理：看门狗就是一段定时重入——重入即刷新 TTL
    var pc3 = popStr(lt, 2.0);
    if (pc3 > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(pc3 * 1.6, 0, 1) * 0.96;
      rr(90, 940, 900, 204, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = "rgba(217,169,78,.4)"; ctx.lineWidth = 2; ctx.stroke();
      txt('// 看门狗：拿到锁自动启动，每 TTL/3 续一次', 120, 984, 24, 600, SUB, "left");
      txt('watchdog.scheduleAtFixedRate(() ->', 120, 1030, 28, 800, "#e8d9b8", "left", true);
      txt('    tryLock("settle"),   // 重入 → TTL 刷新 ✓', 120, 1076, 28, 800, "#e8d9b8", "left", true);
      txt('}, TTL/3, TTL/3);', 120, 1122, 28, 800, "#e8d9b8", "left", true);
      ctx.restore();
    }
    popText("✓ 集群里只有 A 在跑，锁稳稳在手", W / 2, 1200, 56, 900, INK_HI, lt, 8, true);
    sparkBurst(540, 560, lt, 8.2);
  }

  /* ---------- S4 踩坑 22–36：嵌套加锁故障（全程集群视图，直白叙事） ---------- */
  function s4(lt) {
    popText("但是——A 里嵌套加了一次锁", W / 2, 300, 58, 900, INK_HI, lt, 0.08, true);
    underline(W / 2, 325, 520, lt, 0.3, INK);

    var dead = lt >= 3.0;                    // 内层 unlock → 看门狗被顺手关掉
    var expired = lt >= 7.0;                 // TTL 过期，锁飞回存储
    var stolenB = lt >= 7.6;                 // Pod B 抢到

    hubCard(lt, 0.2,
      stolenB ? "Pod B" : (expired ? "过期" : "Pod A"),
      (expired || stolenB) ? RED : WARM, !expired);
    conns(0.5, stolenB ? 1 : 0);
    flyLock(lt, 7.0, 0.35, CX[0], PY + 110, 540, 435);   // 过期收回
    flyLock(lt, 7.6, 0.35, 540, 435, CX[1], PY + 110);   // 授予 Pod B

    // 看门狗活着时（0–3s）保持续期脉冲；死后脉冲戛然而止
    if (!dead) renewPulse(lt, (lt - 0.6) % 1.9, CX[0]);

    clusterPod(0, lt, 0.25, {
      name: "Pod A", stroke: expired ? "rgba(217,169,78,.25)" : INK, glow: !expired,
      stateLines: dead ? (expired ? ["还在跑 🔥", "狗已死 ✝"] : ["持锁 · 狗已死 ✝"])
                       : ["持锁 🔒 🐕", "双层任务"],
      stateColor: dead ? (expired ? RED : "#9a927e") : WARM,
      ttlFrac: lt >= 0.8 ? 1 - clamp((lt - 3.5) / 3.5, 0, 1) : 1,
      ttlColor: expired ? RED : INK, ttlGlow: !expired,
      taskFrac: clamp((lt - 1.7) / 9.0, 0, 0.6)
    });
    if (dead && lt < 4.4) {                  // 看门狗死亡标记（浮起渐隐）
      ctx.save();
      ctx.globalAlpha = 1 - (lt - 3.0) / 1.4;
      glow("rgba(255,77,77,.7)", 12);
      txt("🐕 ✝ 已停", CX[0], PY - 26 - (lt - 3.0) * 30, 26, 900, RED);
      ctx.restore();
    }
    for (var i = 1; i < 4; i++) {
      (function (i) {
        var isThief = stolenB && i === 1;
        clusterPod(i, lt, 0.3 + i * 0.08, {
          name: "Pod " + "ABCD"[i],
          stroke: isThief ? RED : "rgba(217,169,78,.2)", glow: isThief,
          stateLines: isThief ? ["抢到锁 🔒", "开跑"]
                              : (lt >= 1.1 ? ["未获锁", "跳过"] : ["排队等待…"]),
          stateColor: isThief ? RED : SUB
        });
      })(i);
    }

    // 双层任务徽章：直观展示"同一把锁拿了两层"
    var chipY = 970, chH = 56;
    function chip(x, w, text, color, stroke, at) {
      var p = popStr(lt, at);
      if (p <= 0) return;
      ctx.save();
      var cx = x + w / 2, cy = chipY + chH / 2;
      ctx.translate(cx, cy); ctx.scale(p, p); ctx.translate(-cx, -cy);
      ctx.globalAlpha = clamp(p * 1.6, 0, 1);
      rr(x, chipY, w, chH, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = stroke; ctx.lineWidth = 2.5; ctx.stroke();
      txt(text, cx, chipY + chH / 2 + 9, 24, 800, color);
      ctx.restore();
    }
    chip(150, 300, "外层任务 · 运行中", WARM, INK, 0.5);
    chip(630, 300, lt >= 2.6 ? "内层 · 已 unlock ✓" : "内层子任务 · 运行中",
         lt >= 2.6 ? SUB : WARM, lt >= 2.6 ? "rgba(217,169,78,.3)" : INK, 1.2);
    ctx.save();
    ctx.globalAlpha = 0.4; ctx.strokeStyle = DIM; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(450, chipY + chH / 2); ctx.lineTo(630, chipY + chH / 2);
    ctx.stroke();
    ctx.restore();

    var ps = popStr(lt, 8);
    if (ps > 0) {
      ctx.save();
      ctx.translate(880, 380); ctx.rotate(-0.16); ctx.scale(ps, ps);
      rr(-165, -78, 330, 156, 14);
      ctx.fillStyle = "rgba(255,77,77,.1)"; ctx.fill();
      glow("rgba(255,77,77,.6)", 24);
      ctx.strokeStyle = RED; ctx.lineWidth = 11; ctx.stroke(); noGlow();
      txt("P0", 0, 40, 124, 900, RED);
      ctx.restore();
    }
    if (lt >= 8.6) {
      popText("A 还在跑，B 也在跑", W / 2, 1300, 58, 900, RED, lt, 8.6, true);
      popText("跨实例互斥失效 —— P0！", W / 2, 1386, 58, 900, RED, lt, 8.75, true);
    }
  }

  /* ---------- S5 修复 36–48 ---------- */
  function s5(lt) {
    popText("修复：重入深度计数", W / 2, 320, 62, 900, INK_HI, lt, 0.08, true);
    underline(W / 2, 345, 430, lt, 0.3, INK);
    var nums = [["2", "外层+内层", 0.2, INK], ["1", "内层只递减\n狗还在 🐕", 2.2, INK], ["0", "归零才停狗\n✓ 正确释放", 4.4, "rgba(217,169,78,.45)"]];
    var xs = [120, 400, 680];
    for (var i = 0; i < 3; i++) {
      (function (i) {
        var n = nums[i], size = 260;
        var p = popStr(lt, n[2]);
        if (p <= 0) return;
        ctx.save();
        var cx = xs[i] + size / 2, cy = 450 + size / 2;
        ctx.translate(cx, cy); ctx.scale(p, p); ctx.translate(-cx, -cy);
        ctx.globalAlpha = clamp(p * 1.6, 0, 1);
        rr(xs[i], 450, size, size, 16);
        ctx.fillStyle = CARD; ctx.fill();
        ctx.strokeStyle = n[3]; ctx.lineWidth = 3; ctx.stroke();
        txt(n[0], cx, 450 + 140, 112, 900, PAPER);
        var parts = n[1].split("\n");
        for (var k2 = 0; k2 < parts.length; k2++) {
          txt(parts[k2], cx, 450 + 200 + k2 * 38, 28, 600, SUB);
        }
        ctx.restore();
        if (i < 2) popText("→", xs[i] + size + 32, 605, 76, 400, DIM, lt, i === 0 ? 1.6 : 3.8);
      })(i);
    }
    var pc = popStr(lt, 5.2);
    if (pc > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(pc * 1.6, 0, 1);
      rr(90, 900, 900, 116, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = "rgba(217,169,78,.4)"; ctx.lineWidth = 2; ctx.stroke();
      var seg = [["depth--", INK_HI], ["; if (depth == ", "#e8d9b8"], ["0", INK_HI], [") stopWatchdog();", "#e8d9b8"]];
      var fsz = 40;                            // 代码行自适应缩字号，永不超卡片
      function totalAt(sz) {
        ctx.font = "700 " + sz + "px " + MONO;
        return seg.reduce(function (a, sm) { return a + ctx.measureText(sm[0]).width; }, 0);
      }
      var total = totalAt(fsz);
      if (total > 840) { fsz = Math.floor(fsz * 840 / total); total = totalAt(fsz); }
      var px = 540 - total / 2;
      seg.forEach(function (sm) {
        ctx.fillStyle = sm[1]; ctx.textAlign = "left"; ctx.fillText(sm[0], px, 968);
        px += ctx.measureText(sm[0]).width;
      });
      ctx.restore();
    }
    popText("嵌套的内层 finally，再也不会误杀看门狗", W / 2, 1120, 50, 800, INK_HI, lt, 6, true);
    sparkBurst(540, 580, lt, 6.2);
  }

  /* ---------- S6 清单 48–58 ---------- */
  function s6(lt) {
    popText("上线前检查清单", W / 2, 320, 62, 900, PAPER, lt, 0.08, true);
    underline(W / 2, 345, 380, lt, 0.3, INK);
    var items = [
      ["1", "长任务必开看门狗", "任务时长可能超过 TTL 的，都要开", 0.3],
      ["2", "嵌套加锁：内层只递减，归零才停", "重入语义必须配对，finally 也不例外", 1.5],
      ["3", "锁不是闸门，幂等才是兜底", "存储抖动 fail-open 放行，业务幂等扛住双跑", 2.7]
    ];
    for (var i = 0; i < 3; i++) {
      (function (it) {
        var p = popStr(lt, it[3]);
        if (p <= 0) return;
        ctx.save();
        var y0 = 410 + i * 250, cx = 540, cy = y0 + 105;
        ctx.translate(cx, cy); ctx.scale(p, p); ctx.translate(-cx, -cy);
        ctx.globalAlpha = clamp(p * 1.6, 0, 1);
        rr(90, y0, 900, 210, 12); ctx.fillStyle = CARD; ctx.fill();
        ctx.strokeStyle = "rgba(217,169,78,.35)"; ctx.lineWidth = 2; ctx.stroke();
        ctx.save(); glow(INK, 14);
        ctx.beginPath(); ctx.arc(178, y0 + 105, 38, 0, 6.283);
        ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
        txt(it[0], 178, y0 + 122, 44, 900, INK_HI);
        txt(it[1], 252, y0 + 92, 40, 800, PAPER, "left");
        txt(it[2], 252, y0 + 148, 30, 600, SUB, "left");
        ctx.restore();
      })(items[i]);
    }
  }

  /* ---------- S7 CTA 58–62.5 ---------- */
  function s7(lt) {
    popText("📌", W / 2, 560, 100, 400, PAPER, lt, 0);
    popText("收藏这篇", W / 2, 760, 92, 900, INK_HI, lt, 0.2, true);
    popText("长任务上线前过一遍", W / 2, 890, 92, 900, PAPER, lt, 0.35, true);
    underline(W / 2, 920, 520, lt, 0.7, INK);
    var p = popStr(lt, 0.6);
    if (p > 0) {
      ctx.save();
      ctx.globalAlpha = clamp(p * 1.6, 0, 1);
      rr(110, 1040, 860, 150, 10); ctx.fillStyle = CARD; ctx.fill();
      ctx.strokeStyle = "rgba(217,169,78,.4)"; ctx.lineWidth = 2; ctx.stroke();
      txt("评论区聊聊：你们的服务，锁的续期谁在做？", 540, 1148, 36, 800, "#cfc4ad");
      ctx.restore();
    }
    popText("star-site-components · 七组件 · 开源", W / 2, 1330, 32, 700, "#8b8676", lt, 1);
    sparkBurst(540, 560, lt, 0.35);
  }

  var SCENES = [
    { from: 0, to: 3.5, draw: s1 }, { from: 3.5, to: 12, draw: s2 },
    { from: 12, to: 22, draw: s3 }, { from: 22, to: 36, draw: s4 },
    { from: 36, to: 48, draw: s5 }, { from: 48, to: 58, draw: s6 },
    { from: 58, to: TOTAL + 1, draw: s7 }
  ];

  function render(s) {
    var shakeX = 0, shakeY = 0;
    if ((s >= 8.7 && s < 9.4) || (s >= 30.0 && s < 30.7)) {
      var e = s >= 30 ? s - 30.0 : s - 8.7;
      var amp = 14 * Math.max(0, 1 - e / 0.7);
      shakeX = Math.sin(s * 71) * amp; shakeY = Math.cos(s * 83) * amp;
    }
    drawBg(s, shakeX, shakeY);
    ctx.save();
    ctx.translate(shakeX, shakeY);
    var idx = 0;
    for (var i = 0; i < SCENE_BOUNDS.length; i++) {
      if (s >= SCENE_BOUNDS[i][0] && s < SCENE_BOUNDS[i][1]) { idx = i; break; }
    }
    var from = SCENE_BOUNDS[idx][0];
    var fadeIn = clamp((s - from) / 0.35, 0, 1);
    ctx.save();
    ctx.globalAlpha = fadeIn;
    var sc = 1 + 0.02 * (1 - easeOutCubic(fadeIn));
    ctx.translate(W / 2, H / 2 - 80); ctx.scale(sc, sc); ctx.translate(-W / 2, -(H / 2 - 80));
    SCENES[idx].draw(s - from);
    ctx.restore();
    hudChrome(s, idx);
    captionBar(s);
    ctx.restore();
    progressBar(s);
  }

  /* ---------- 确定性帧导出（不依赖 rAF——节流环境可靠出帧） ---------- */
  window.__snap = function (n0, n1) {
    var out = [];
    for (var i = n0; i < n1 && i < Math.ceil(TOTAL * 25); i++) {
      render(i / 25);
      out.push(cv.toDataURL("image/png"));
    }
    return out;
  };

  /* ---------- 实时预览（本地浏览器点 ▶；出片走 __snap） ----------
     用 setInterval + 墙钟而不是 rAF：内嵌面板会深度节流 rAF（恒 0 帧），
     setInterval 节流上限 1s 且时间取自墙钟——面板可见时实时，隐藏时不冻帧 */
  document.getElementById("go").addEventListener("click", function () {
    document.getElementById("start").style.display = "none";
    var stat = document.getElementById("stat");
    var bgm = document.getElementById("bgm");
    var audioOk = true;                      // 配乐加载失败时如实提示（出片工具≠播放器）
    try {
      bgm.currentTime = 0;
      bgm.play().catch(function () {
        audioOk = false;
        stat.textContent = "🔇 预览无声：本地服务未启动 —— 带声音的成片请看 preview.html";
      });
    } catch (_) { audioOk = false; }
    var t0 = Date.now();
    var busy = false;                        // 上一帧未画完则跳过本 tick（主线程减负，
    var timer = setInterval(function () {    // 防止渲染饱和导致媒体被 webview 暂停）
      var s = (Date.now() - t0) / 1000;
      stat.textContent = audioOk
        ? Math.min(s, TOTAL).toFixed(1) + "s"
        : "🔇 预览无声 —— 成片请看 preview.html";
      if (busy || document.hidden) return;
      busy = true;
      try {
        render(Math.min(s, TOTAL));
      } finally {
        busy = false;
      }
      if (s >= TOTAL + TAIL) { clearInterval(timer); try { bgm.pause(); } catch (_) {} }
    }, 66);
  });
})();
</script>
