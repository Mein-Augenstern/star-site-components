name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # JDK 21 + Boot 2.7 BOM 编译 + 全量测试 + 真库 IT
  build:
    # 钉 24.04：ubuntu-latest(26.04) 新镜像不再预装 Docker 守护进程，真库 IT 需要 docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # spotless 规范检查（许可头/未用导入/空白）+ 全量单测；ubuntu 自带 docker，真库 IT 一并跑
      - name: Build, check style, unit & integration tests
        run: mvn -B verify -Pit

  # JDK 8 兼容验证：JDK 21 编译（release 8 字节码）→ JDK 8 JVM 加载运行
  # （Spotless 插件自身是 Java 11+ 字节码，无法在 JDK 8 Maven 上运行——构建工具限制非组件问题）
  jdk8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile to release 8 bytecode
        run: mvn -B clean install -Dmaven.test.skip=true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify class file version + JDK 8 runtime smoke
        run: |
          # ① 验证全部主 JAR 的 class 文件版本 = 52.0（Java 8）
          for jar in ~/.m2/repository/com/xp/starsite/*/0.2.3/*-0.2.3.jar; do
            jar_name=$(basename "$jar")
            # javap 首个 class 验证 major version
            version=$(/usr/lib/jvm/temurin-8-jdk-amd64/bin/javap -verbose -cp "$jar" \
              $(unzip -l "$jar" | grep '\.class' | head -1 | awk '{print $4}' | sed 's/\.class//; s/\//./g; s/^\.\.//') 2>/dev/null | grep "major version" | awk '{print $4}')
            echo "$jar_name: major=$version"
            if [ "$version" != "52" ]; then
              echo "FAIL: $jar_name has class file version $version, expected 52 (Java 8)"
              exit 1
            fi
          done
          echo "=== All JARs are Java 8 bytecode (class file version 52) ==="
