name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # JDK 21 + Boot 2.7 BOM 编译 + 全量测试 + 真库 IT
  build:
    # 钉 24.04：ubuntu-latest(26.04) 新镜像不再预装 Docker 守护进程，真库 IT 需要 docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # spotless 规范检查（许可头/未用导入/空白）+ 全量单测；ubuntu 自带 docker，真库 IT 一并跑
      - name: Build, check style, unit & integration tests
        run: mvn -B verify -Pit

  # JDK 8 兼容验证：release 8 字节码 + 全量单测（Spotless 跳过——google-java-format 需 11+）
  jdk8:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: JDK 8 compile + unit tests (skip Spotless/IT)
        run: mvn -B verify -DskipITs -Dspotless.skip=true
